# Local mirror of the CI Qt lane, so a failure here is a failure there.
#
#   docker compose run --rm tests    # build + ctest
#   docker compose run --rm syntax   # compile-check all of src/
#
# The build tree lives at /build inside the container rather than in the
# mounted source, so no root-owned artifacts land in the repository.

services:
  tests:
    build: ./tests
    volumes:
      - .:/src
    working_dir: /src
    command: >
      bash -c "cmake -S tests -B /build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      && cmake --build /build
      && QT_QPA_PLATFORM=offscreen ctest --test-dir /build --output-on-failure"

  syntax:
    build: ./tests
    volumes:
      - .:/src
    working_dir: /src
    command: bash tests/syntax-check.sh

  # App icon: cuts the leaf out of its artwork and writes every size the RPM
  # ships. Run when the icon changes, not as part of any build.
  icons:
    image: python:3.12-slim
    volumes:
      - .:/src
    working_dir: /src
    command: >
      bash -c "pip install --quiet --no-cache-dir pillow
      && python3 scripts/make_icons.py"

  # Beat analysis: fetches the clip music and writes each track's grid beside
  # it. Run once when a track changes, not as part of any build. The grids
  # are committed, the audio is not.
  beats:
    build:
      context: ./tests
      dockerfile: Dockerfile.beats
    volumes:
      - .:/src
    working_dir: /src
    command: >
      bash -c "bash media/prepare_tracks.sh
      && python3 scripts/analyze_track.py"

  # The recognition engine end to end. Its own image (OpenCV >= 4.8) and its
  # own downloads: the ML models and the reference portraits, both checksum
  # pinned and skipped when already present.
  pipeline:
    build:
      context: ./tests
      dockerfile: Dockerfile.pipeline
    volumes:
      - .:/src
    working_dir: /src
    command: >
      bash -c "bash scripts/download_models_for_build.sh
      && bash tests/fixtures/download_faces.sh
      && cmake -S tests -B /build-pipeline -G Ninja -DCMAKE_BUILD_TYPE=Debug
      -DWITH_PIPELINE_TESTS=ON
      && cmake --build /build-pipeline --target tst_pipeline
      && QT_QPA_PLATFORM=offscreen ctest --test-dir /build-pipeline
      -R pipeline --output-on-failure"
