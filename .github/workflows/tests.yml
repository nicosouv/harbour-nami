name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Fast lane: no Qt, no container, runs in seconds on every push
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: QML anti-pattern checks
        run: python3 scripts/check_qml.py

      - name: JavaScript unit tests
        run: node tests/js/run.js

  # Qt lane: plain ubuntu, no container and no OpenCV - the tests build
  # against Qt and OpenSSL only, which is the whole point of keeping the
  # storage and crypto layers free of the vision stack
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Qt5 and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtdeclarative5-dev libqt5sql5-sqlite libssl-dev \
            cmake ninja-build

      - name: Build tests
        run: |
          cmake -S tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-tests

      - name: Run tests
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build-tests --output-on-failure

  # The unit tests are kept free of OpenCV, which means nothing above ever
  # compiles facepipeline.cpp or the vision classes. This lane does, against
  # Ubuntu's OpenCV rather than the cross-compiled minimal build, so a
  # signature error surfaces here instead of in a tag's RPM build.
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Qt5 and OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtdeclarative5-dev libopencv-dev g++ pkg-config

      - name: Compile-check src/
        run: bash tests/syntax-check.sh

  # The recognition engine end to end, on real portraits. Runs in a Debian
  # container rather than on the runner: the YuNet 2023mar model needs
  # OpenCV >= 4.8 and ubuntu-latest still ships 4.6.
  pipeline:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Qt5 and OpenCV
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            qtbase5-dev qtdeclarative5-dev libqt5sql5-sqlite libopencv-dev \
            libssl-dev cmake ninja-build g++ pkg-config ca-certificates curl

      - name: Cache models and reference portraits
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            python/models
            tests/fixtures/faces
          key: nami-recognition-fixtures-v1-${{ hashFiles('scripts/download_models_for_build.sh', 'tests/fixtures/download_faces.sh') }}

      - name: Download models and reference portraits
        run: |
          bash scripts/download_models_for_build.sh
          bash tests/fixtures/download_faces.sh

      - name: Build and run
        run: |
          cmake -S tests -B build-pipeline -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DWITH_PIPELINE_TESTS=ON
          cmake --build build-pipeline --target tst_pipeline
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-pipeline \
            -R pipeline --output-on-failure
