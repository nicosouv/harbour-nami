name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Fast lane: no Qt, no container, runs in seconds on every push
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: QML anti-pattern checks
        run: python3 scripts/check_qml.py

      - name: JavaScript unit tests
        run: node tests/js/run.js

  # Qt lane: plain ubuntu, no container and no OpenCV - the tests build
  # against Qt and OpenSSL only, which is the whole point of keeping the
  # storage and crypto layers free of the vision stack
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Qt5 and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev libqt5sql5-sqlite libssl-dev cmake ninja-build

      - name: Build tests
        run: |
          cmake -S tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-tests

      - name: Run tests
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build-tests --output-on-failure

  # QML syntax, in the container because Silica lives there
  qmllint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Prepare Build Directories
        run: chmod -R 777 .

      - name: qmllint
        run: |
          docker run --rm \
            -v $(pwd):/home/mersdk/src:z \
            coderus/sailfishos-platform-sdk:5.0.0.43 \
            bash -c "cd /home/mersdk/src && find qml -name '*.qml' -print0 | xargs -0 qmllint"
